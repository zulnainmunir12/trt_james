<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Care Operations — TRT Australia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">

  <div class="brand">
    <img src="trt-logo.webp" alt="TRT Australia">
    <span class="nm">Care Operations</span>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search tickets and clients" aria-label="Search">
      <span class="kbd">/</span>
    </label>
    <span class="spacer"></span>
    <span class="who">
      <span class="av av-sm" style="background:#1a6ba5" aria-hidden="true">AK</span>
      <span>Alex Kaur · Client care</span>
    </span>
  </header>

  <nav class="side" id="tabs" aria-label="Sections"></nav>

  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
