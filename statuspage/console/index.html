<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Care Operations — TRT Australia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">

  <div class="brand">
    <span class="brand-mark" aria-hidden="true">TA</span>
    <span>
      <div class="brand-t">TRT Australia</div>
      <div class="brand-s">Care operations</div>
    </span>
  </div>

  <header class="topbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search clients, subjects, messages…"
             aria-label="Search">
      <span class="kbd">/</span>
    </label>
    <span class="spacer"></span>
    <span class="who">
      <span id="clock">—</span>
      <span class="av" style="background:#6aa6f7" aria-hidden="true">AK</span>
      <span>Alex Kaur · Client care</span>
    </span>
  </header>

  <nav class="rail" id="rail" aria-label="Queues"></nav>

  <section class="list" aria-label="Conversations">
    <div class="list-head">
      <h2 id="queue-name">Inbox</h2>
      <span class="ct" id="queue-count"></span>
      <span class="spacer"></span>
      <button class="chip" id="f-todo" aria-pressed="false">To do</button>
      <button class="chip" id="f-progress" aria-pressed="false">In progress</button>
      <button class="chip" id="f-unread" aria-pressed="false">Unread</button>
      <button class="chip" id="f-urgent" aria-pressed="false">Urgent</button>
    </div>
    <div class="list-body" id="list" role="list"></div>
  </section>

  <main class="pane" id="pane" aria-label="Conversation"></main>

</div>

<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="app.js"></script>
</body>
</html>
